server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: trading-service
          uri: lb://trading-service
          predicates:
            - Path=/trade/**
          filters:
            - StripPrefix=1
        - id: market-service
          uri: lb://market-service
          predicates:
            - Path=/market/**
          filters:
            - StripPrefix=1
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/portfolio/**
          filters:
            - StripPrefix=1
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/analysis/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: '*'
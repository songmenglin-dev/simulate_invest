server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: trading-service
          uri: lb://trading-service
          predicates:
            - Path=/trade/**
        - id: market-service
          uri: lb://market-service
          predicates:
            - Path=/market/**
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/portfolio/**
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/analysis/**
        - id: conditional-order-service
          uri: lb://trading-service
          predicates:
            - Path=/conditional-order/**
        - id: watchlist-service
          uri: lb://market-service
          predicates:
            - Path=/watchlist/**
        - id: alert-service
          uri: lb://market-service
          predicates:
            - Path=/alert/**
        - id: backtest-service
          uri: lb://analysis-service
          predicates:
            - Path=/backtest/**

management:
  endpoints:
    web:
      exposure:
        include: '*'
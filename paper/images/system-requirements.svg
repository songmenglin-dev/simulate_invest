<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <style>
      @font-face {
        font-family: 'Microsoft YaHei';
        src: local('Microsoft YaHei'), local('PingFang SC');
      }
      .title { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 20px; font-weight: bold; fill: #1f2937; }
      .module-title { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
      .module-label { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 14px; fill: #374151; }
      .layer-title { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 15px; font-weight: bold; fill: #1f2937; }
      .item-label { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 13px; fill: #4b5563; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">股票投资分析系统需求分析</text>

  <!-- Top Row: Three Main Modules -->
  <!-- Module 1: 用户模块 -->
  <rect x="30" y="55" width="280" height="130" rx="8" fill="#2563eb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="78" text-anchor="middle" class="module-title">用户模块</text>
  <rect x="50" y="92" width="240" height="82" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="170" y="113" text-anchor="middle" class="item-label">注册 / 登录</text>
  <text x="170" y="132" text-anchor="middle" class="item-label">个人信息</text>
  <text x="170" y="151" text-anchor="middle" class="item-label">投资组合</text>

  <!-- Module 2: 股票模块 -->
  <rect x="340" y="55" width="280" height="130" rx="8" fill="#2563eb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="78" text-anchor="middle" class="module-title">股票模块</text>
  <rect x="360" y="92" width="240" height="82" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="113" text-anchor="middle" class="item-label">搜索 / 行情</text>
  <text x="480" y="132" text-anchor="middle" class="item-label">实时价格</text>
  <text x="480" y="151" text-anchor="middle" class="item-label">K线</text>

  <!-- Module 3: 交易模块 -->
  <rect x="650" y="55" width="280" height="130" rx="8" fill="#2563eb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="790" y="78" text-anchor="middle" class="module-title">交易模块</text>
  <rect x="670" y="92" width="240" height="82" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="790" y="113" text-anchor="middle" class="item-label">模拟交易</text>
  <text x="790" y="132" text-anchor="middle" class="item-label">订单管理</text>
  <text x="790" y="151" text-anchor="middle" class="item-label">持仓查询 / 资金流水</text>

  <!-- Middle Row: Analysis Module -->
  <!-- Arrows from top modules to analysis -->
  <path d="M170 185 L170 210 L395 210" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="395,205 405,210 395,215" fill="#2563eb"/>

  <path d="M480 185 L480 220" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="475,215 480,225 485,215" fill="#2563eb"/>

  <path d="M790 185 L790 210 L565 210" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="565,205 555,210 565,215" fill="#2563eb"/>

  <!-- Analysis Module -->
  <rect x="340" y="225" width="280" height="130" rx="8" fill="#059669" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="248" text-anchor="middle" class="module-title">分析模块</text>
  <rect x="360" y="262" width="240" height="82" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="283" text-anchor="middle" class="item-label">策略回测</text>
  <text x="480" y="302" text-anchor="middle" class="item-label">指标计算</text>
  <text x="480" y="321" text-anchor="middle" class="item-label">趋势分析 / 风险评估</text>

  <!-- Arrows from analysis to bottom layers -->
  <path d="M340 355 L260 355 L260 380" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="255,375 260,385 265,375" fill="#2563eb"/>

  <path d="M480 355 L480 380" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="475,375 480,385 485,375" fill="#2563eb"/>

  <path d="M620 355 L700 355 L700 380" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="695,375 700,385 705,375" fill="#2563eb"/>

  <!-- Bottom Layer: Three Layers -->
  <!-- Layer 1: 数据存储层 -->
  <rect x="30" y="390" width="220" height="110" rx="8" fill="#7c3aed" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="140" y="413" text-anchor="middle" class="module-title">数据存储层</text>
  <rect x="50" y="427" width="180" height="62" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="140" y="447" text-anchor="middle" class="item-label">MySQL</text>
  <text x="140" y="466" text-anchor="middle" class="item-label">Redis</text>

  <!-- Layer 2: 外部接口层 -->
  <rect x="280" y="390" width="220" height="110" rx="8" fill="#dc2626" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="413" text-anchor="middle" class="module-title">外部接口层</text>
  <rect x="300" y="427" width="180" height="62" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="390" y="447" text-anchor="middle" class="item-label">行情API</text>
  <text x="390" y="466" text-anchor="middle" class="item-label">交易接口</text>

  <!-- Layer 3: 展示层 -->
  <rect x="530" y="390" width="220" height="110" rx="8" fill="#d97706" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="640" y="413" text-anchor="middle" class="module-title">展示层</text>
  <rect x="550" y="427" width="180" height="62" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="640" y="447" text-anchor="middle" class="item-label">Web前端</text>
  <text x="640" y="466" text-anchor="middle" class="item-label">移动端</text>

  <!-- Legend -->
  <rect x="780" y="390" width="150" height="110" rx="5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="855" y="408" text-anchor="middle" class="layer-title">图例</text>
  <rect x="795" y="418" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="820" y="432" class="item-label" style="font-size:12px">业务模块</text>
  <rect x="795" y="443" width="18" height="18" rx="3" fill="#059669"/>
  <text x="820" y="457" class="item-label" style="font-size:12px">分析模块</text>
  <rect x="795" y="468" width="18" height="18" rx="3" fill="#7c3aed"/>
  <text x="820" y="482" class="item-label" style="font-size:12px">存储层</text>
  <rect x="795" y="493" width="18" height="18" rx="3" fill="#dc2626"/>
  <text x="820" y="507" class="item-label" style="font-size:12px">接口层</text>
  <path d="M795 505 L810 505" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="510" class="item-label" style="font-size:12px">数据流向</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">股票投资平台功能模块图</text>

  <!-- 前端 -->
  <rect x="360" y="55" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Vue3 前端</text>

  <!-- 连接线：前端到网关 -->
  <line x1="480" y1="95" x2="480" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- API网关 -->
  <rect x="360" y="120" width="240" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">API Gateway</text>

  <!-- 连接线：网关到5个服务 -->
  <line x1="400" y1="160" x2="140" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="440" y1="160" x2="300" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="480" y1="160" x2="480" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="160" x2="660" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="160" x2="820" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 服务层标签 -->
  <text x="480" y="190" text-anchor="middle" font-size="11" fill="#9ca3af">后端服务层</text>

  <!-- 用户服务 -->
  <rect x="60" y="200" width="160" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="200" width="160" height="35" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">用户服务</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#6b7280">UserService</text>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#9ca3af">CaptchaService</text>
  <line x1="70" y1="285" x2="210" y2="285" stroke="#e5e7eb" stroke-width="1"/>
  <text x="140" y="305" text-anchor="middle" font-size="11" fill="#374151">用户注册</text>
  <text x="140" y="325" text-anchor="middle" font-size="11" fill="#374151">用户登录</text>
  <text x="140" y="345" text-anchor="middle" font-size="11" fill="#374151">个人信息</text>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="#374151">头像上传</text>
  <text x="140" y="385" text-anchor="middle" font-size="11" fill="#374151">资金账户</text>

  <!-- 行情服务 -->
  <rect x="240" y="200" width="160" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="240" y="200" width="160" height="35" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">行情服务</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#6b7280">MarketService</text>
  <text x="320" y="270" text-anchor="middle" font-size="10" fill="#9ca3af">MarketDataClient</text>
  <text x="320" y="285" text-anchor="middle" font-size="10" fill="#9ca3af">WatchlistService</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#9ca3af">PriceAlertService</text>
  <line x1="250" y1="315" x2="390" y2="315" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="335" text-anchor="middle" font-size="11" fill="#374151">股票搜索</text>
  <text x="320" y="355" text-anchor="middle" font-size="11" fill="#374151">实时行情</text>
  <text x="320" y="375" text-anchor="middle" font-size="11" fill="#374151">K线数据</text>
  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#374151">技术指标</text>

  <!-- 交易服务 -->
  <rect x="420" y="200" width="160" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="420" y="200" width="160" height="35" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="500" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">交易服务</text>
  <text x="500" y="250" text-anchor="middle" font-size="11" fill="#6b7280">OrderService</text>
  <text x="500" y="270" text-anchor="middle" font-size="10" fill="#9ca3af">ConditionalOrderService</text>
  <line x1="430" y1="285" x2="570" y2="285" stroke="#e5e7eb" stroke-width="1"/>
  <text x="500" y="305" text-anchor="middle" font-size="11" fill="#374151">普通下单</text>
  <text x="500" y="325" text-anchor="middle" font-size="11" fill="#374151">订单管理</text>
  <text x="500" y="345" text-anchor="middle" font-size="11" fill="#374151">条件单管理</text>
  <text x="500" y="365" text-anchor="middle" font-size="11" fill="#374151">止损单</text>
  <text x="500" y="385" text-anchor="middle" font-size="11" fill="#374151">止盈单</text>

  <!-- 组合服务 -->
  <rect x="600" y="200" width="160" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="600" y="200" width="160" height="35" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="680" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">资产服务</text>
  <text x="680" y="250" text-anchor="middle" font-size="11" fill="#6b7280">PortfolioService</text>
  <line x1="610" y1="265" x2="750" y2="265" stroke="#e5e7eb" stroke-width="1"/>
  <text x="680" y="285" text-anchor="middle" font-size="11" fill="#374151">持仓查询</text>
  <text x="680" y="305" text-anchor="middle" font-size="11" fill="#374151">资产总览</text>
  <text x="680" y="325" text-anchor="middle" font-size="11" fill="#374151">盈亏计算</text>
  <text x="680" y="345" text-anchor="middle" font-size="11" fill="#374151">充值</text>
  <text x="680" y="365" text-anchor="middle" font-size="11" fill="#374151">提现</text>

  <!-- 分析服务 -->
  <rect x="780" y="200" width="160" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="780" y="200" width="160" height="35" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="860" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">分析服务</text>
  <text x="860" y="250" text-anchor="middle" font-size="11" fill="#6b7280">AnalysisService</text>
  <text x="860" y="270" text-anchor="middle" font-size="10" fill="#9ca3af">BacktestService</text>
  <line x1="790" y1="285" x2="930" y2="285" stroke="#e5e7eb" stroke-width="1"/>
  <text x="860" y="305" text-anchor="middle" font-size="11" fill="#374151">财务分析</text>
  <text x="860" y="325" text-anchor="middle" font-size="11" fill="#374151">策略回测</text>

  <!-- 服务间调用关系 -->
  <line x1="220" y1="300" x2="240" y2="300" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="400" y1="300" x2="420" y2="300" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="580" y1="300" x2="600" y2="300" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="760" y1="300" x2="780" y2="300" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- 外部服务 -->
  <rect x="300" y="450" width="130" height="50" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="365" y="475" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">MinIO存储</text>
  <text x="365" y="492" text-anchor="middle" font-size="10" fill="#6b7280">头像上传</text>

  <rect x="460" y="450" width="130" height="50" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="525" y="475" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Redis缓存</text>
  <text x="525" y="492" text-anchor="middle" font-size="10" fill="#6b7280">令牌存储</text>

  <rect x="620" y="450" width="130" height="50" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="685" y="475" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Nacos</text>
  <text x="685" y="492" text-anchor="middle" font-size="10" fill="#6b7280">注册与配置</text>

  <rect x="100" y="450" width="130" height="50" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="165" y="475" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">MySQL</text>
  <text x="165" y="492" text-anchor="middle" font-size="10" fill="#6b7280">持久化存储</text>

  <!-- 业务模块分组 -->
  <rect x="40" y="520" width="280" height="140" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="540" font-size="13" font-weight="600" fill="#2563eb">用户域</text>
  <text x="55" y="565" font-size="11" fill="#374151">身份注册 · 登录认证 · 个人信息</text>
  <text x="55" y="585" font-size="11" fill="#374151">头像上传 · 资金账户管理</text>
  <text x="55" y="605" font-size="11" fill="#374151">JWT令牌 · 权限控制</text>
  <text x="55" y="625" font-size="11" fill="#374151">余额查询</text>

  <rect x="340" y="520" width="280" height="140" rx="8" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="540" font-size="13" font-weight="600" fill="#16a34a">行情域</text>
  <text x="355" y="565" font-size="11" fill="#374151">股票搜索 · 实时行情</text>
  <text x="355" y="585" font-size="11" fill="#374151">K线数据 · 技术指标</text>
  <text x="355" y="605" font-size="11" fill="#374151">自选股管理 · 价格预警</text>

  <rect x="640" y="520" width="280" height="140" rx="8" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="540" font-size="13" font-weight="600" fill="#dc2626">交易域</text>
  <text x="655" y="565" font-size="11" fill="#374151">市价单 · 限价单</text>
  <text x="655" y="585" font-size="11" fill="#374151">订单管理 · 状态流转</text>
  <text x="655" y="605" font-size="11" fill="#374151">止损单 · 止盈单</text>
  <text x="655" y="625" font-size="11" fill="#374151">定时调度触达</text>

  <!-- 资产域和分析域 -->
  <rect x="40" y="670" width="440" height="30" rx="6" fill="none" stroke="#9333ea" stroke-width="2"/>
  <text x="55" y="690" font-size="12" font-weight="600" fill="#9333ea">资产域</text>
  <text x="120" y="690" font-size="11" fill="#374151">持仓查询 · 资产总览 · 盈亏计算 · 充值提现</text>

  <rect x="500" y="670" width="420" height="30" rx="6" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="515" y="690" font-size="12" font-weight="600" fill="#ea580c">分析域</text>
  <text x="575" y="690" font-size="11" fill="#374151">财务分析 · 策略回测 · 绩效指标</text>
</svg>
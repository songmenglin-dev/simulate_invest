<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">股票投资平台技术架构图</text>

  <!-- 客户端层 -->
  <rect x="50" y="65" width="1000" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="92" font-size="18" font-weight="700" fill="#2563eb">客户端层</text>

  <rect x="180" y="78" width="180" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="270" y="108" text-anchor="middle" font-size="16" font-weight="500" fill="#111827">Vue3 + TypeScript</text>

  <rect x="400" y="78" width="120" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="460" y="108" text-anchor="middle" font-size="16" font-weight="500" fill="#111827">Vite</text>

  <rect x="560" y="78" width="140" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="630" y="108" text-anchor="middle" font-size="16" font-weight="500" fill="#111827">Tailwind CSS</text>

  <rect x="740" y="78" width="280" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="880" y="108" text-anchor="middle" font-size="16" font-weight="500" fill="#111827">Vite Proxy → 后端服务</text>

  <!-- 网关层 -->
  <rect x="50" y="165" width="1000" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="75" y="192" font-size="18" font-weight="700" fill="#b45309">网关层</text>

  <rect x="250" y="178" width="600" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="550" y="208" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Spring Cloud Gateway</text>

  <text x="880" y="208" text-anchor="middle" font-size="15" fill="#6b7280">8080端口</text>

  <!-- 服务层 -->
  <rect x="50" y="265" width="1000" height="280" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="75" y="292" font-size="18" font-weight="700" fill="#374151">服务层</text>

  <!-- 通用模块 -->
  <rect x="60" y="310" width="100" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="110" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">通用模块</text>

  <!-- 用户服务 -->
  <rect x="180" y="310" width="160" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">用户服务</text>

  <!-- 交易服务 -->
  <rect x="360" y="310" width="160" height="60" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">交易服务</text>

  <!-- 行情服务 -->
  <rect x="540" y="310" width="160" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">行情服务</text>

  <!-- 资产服务 -->
  <rect x="720" y="310" width="160" height="60" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="800" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">资产服务</text>

  <!-- 分析服务 -->
  <rect x="900" y="310" width="130" height="60" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="965" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">分析服务</text>

  <!-- 微服务内部架构 -->
  <rect x="180" y="390" width="850" height="140" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="200" y="415" font-size="14" font-weight="500" fill="#9ca3af">微服务内部架构：Controller → Service → Mapper</text>

  <rect x="220" y="430" width="200" height="85" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="320" y="470" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Controller</text>
  <text x="320" y="495" text-anchor="middle" font-size="14" fill="#6b7280">接收请求 · 参数校验</text>

  <rect x="450" y="430" width="200" height="85" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="550" y="470" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Service</text>
  <text x="550" y="495" text-anchor="middle" font-size="14" fill="#6b7280">业务逻辑 · 事务管理</text>

  <rect x="680" y="430" width="200" height="85" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780" y="470" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Mapper</text>
  <text x="780" y="495" text-anchor="middle" font-size="14" fill="#6b7280">数据访问 · MyBatis-Plus</text>

  <!-- 箭头：微服务内部 -->
  <line x1="420" y1="472" x2="450" y2="472" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="650" y1="472" x2="680" y2="472" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Nacos注册中心 -->
  <rect x="50" y="570" width="320" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="75" y="598" font-size="17" font-weight="700" fill="#ea580c">Nacos 注册中心</text>
  <text x="75" y="622" font-size="14" fill="#9ca3af">服务发现 · 配置管理</text>

  <!-- 数据层 -->
  <rect x="390" y="570" width="660" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="598" font-size="17" font-weight="700" fill="#16a34a">数据层</text>

  <rect x="430" y="615" width="150" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="505" y="645" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">MySQL</text>
  <text x="505" y="663" text-anchor="middle" font-size="13" fill="#6b7280">主数据存储</text>

  <rect x="610" y="615" width="150" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="685" y="645" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Redis</text>
  <text x="685" y="663" text-anchor="middle" font-size="13" fill="#6b7280">缓存 · 会话存储</text>

  <rect x="790" y="615" width="150" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="865" y="645" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">MinIO</text>
  <text x="865" y="663" text-anchor="middle" font-size="13" fill="#6b7280">文件存储</text>

  <!-- 连接线: 层之间 -->
  <line x1="550" y1="145" x2="550" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="550" y1="245" x2="550" y2="265" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="550" y1="545" x2="550" y2="570" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
</svg>